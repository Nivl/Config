name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax checks
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shell syntax checks
        run: |
          bash -n install.sh
          zsh -n base.zshrc config.zshrc

  install-regression:
    name: Install regression test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run install regression test
        run: bash tests/install_cask_update_test.sh

  worktrees:
    name: Worktrees test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run wt
        run: bash tests/wt_ignored_copy_test.sh

  claude-sync:
    name: Claude config sync test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run claude sync test
        run: bash tests/claude_sync_test.sh
