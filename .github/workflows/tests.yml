name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax checks
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shell syntax checks
        # Three separate `zsh -n` invocations — a single command like
        # `zsh -n a b c` treats b and c as positional args ($1, $2) of
        # script a rather than syntax-checking them, so the missing
        # zshrcs would silently pass (and any real syntax error in
        # them would slip through CI). Also: base.zshrc and
        # config.zshrc moved into shared_config/ in this PR.
        run: |
          zsh -n install.bootstrap.sh
          zsh -n shared_config/base.zshrc
          zsh -n shared_config/config.zshrc

  worktrees:
    name: Worktrees test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run wt
        run: bash tests/wt_ignored_copy_test.sh

  canonicalize:
    name: Canonicalize.jq filter test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run canonicalize test
        run: bash tests/canonicalize_test.sh

  settings-schema:
