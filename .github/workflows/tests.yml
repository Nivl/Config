      - name: Run deny-review-in-workflow test
        run: bash tests/deny_review_in_workflow_test.sh

  # ubuntu, unlike the hook tests above. This one is bash plus tr and grep with
  # no zsh, no brew and no darwin build tag, so it behaves identically and
  # Linux minutes bill at a tenth the rate.
  open-ticket-contract:
    name: open-ticket contract test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run open-ticket contract test
        run: bash tests/open_ticket_contract_test.sh

  # ubuntu, unlike the hook tests above. Those need macOS for zsh, brew, or -tags darwin. This one is
  # bash plus sed, awk, tr, diff and node --check, and the test deliberately avoids in-place sed, so it
  # behaves identically and Linux minutes bill at a tenth the rate.
  work-on-validation:
    name: work-on validation script test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run work-on validation test
        run: bash tests/work_on_validation_test.sh

  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nivl/service-images-go-dev:sha-f614fc3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./internal/... ./cmd/...

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run golangci-lint (darwin build tag)
        # The default lint pass is GOOS=linux and skips files behind
        # //go:build darwin (e.g. internal/brew/runner_darwin.go). Cross-
        # lint them here so darwin-only code can't merge unlinted.
        env:
          GOOS: darwin
        run: golangci-lint run --timeout=5m

  go-darwin:
    name: Go darwin-tagged tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run darwin-tagged tests
        run: go test -tags darwin ./internal/brew/...

  go-integration:
    name: Go fake-brew integration tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: go test -run 'FakeBinarySubprocess' ./internal/brew/...

  go-integration-configgen:
    name: Go configgen integration tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: go test -tags integration ./internal/configgen/...
