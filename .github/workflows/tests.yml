name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax checks
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shell syntax checks
        # Three separate `zsh -n` invocations — a single command like
        # `zsh -n a b c` treats b and c as positional args ($1, $2) of
        # script a rather than syntax-checking them, so the missing
        # zshrcs would silently pass (and any real syntax error in
        # them would slip through CI). Also: base.zshrc and
        # config.zshrc moved into shared_config/ in this PR.
        run: |
          zsh -n install.bootstrap.sh
          zsh -n shared_config/base.zshrc
          zsh -n shared_config/config.zshrc

  worktrees:
    name: Worktrees test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run wt
        run: bash tests/wt_ignored_copy_test.sh

  canonicalize:
    name: Canonicalize.jq filter test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run canonicalize test
        run: bash tests/canonicalize_test.sh

  gh-api-hook:
    name: gh api write-guard hook test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gh api write-guard test
        run: bash tests/gh_api_write_guard_test.sh

  deny-shell-wrapper-hook:
    name: deny-shell-wrapper hook test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deny-shell-wrapper test
        run: bash tests/deny_shell_wrapper_test.sh

  write-under-roots-hook:
    name: write-under-roots hook test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run write-under-roots test
        run: bash tests/write_under_roots_test.sh

  rm-under-tmp-hook:
    name: rm-under-tmp hook test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run rm-under-tmp test
        run: bash tests/rm_under_tmp_test.sh

  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nivl/service-images-go-dev:sha-f614fc3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./internal/... ./cmd/...

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run golangci-lint (darwin build tag)
        # The default lint pass is GOOS=linux and skips files behind
        # //go:build darwin (e.g. internal/brew/runner_darwin.go). Cross-
        # lint them here so darwin-only code can't merge unlinted.
        env:
          GOOS: darwin
        run: golangci-lint run --timeout=5m

  go-darwin:
    name: Go darwin-tagged tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run darwin-tagged tests
        run: go test -tags darwin ./internal/brew/...

  go-integration:
    name: Go fake-brew integration tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: go test -run 'FakeBinarySubprocess' ./internal/brew/...

  go-integration-configgen:
    name: Go configgen integration tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: go test -tags integration ./internal/configgen/...
