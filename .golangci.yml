version: "2"

linters:
  default: all
  disable:
    - ireturn # Complains when returning an interface || failed to ignore with nolint

    # Cool, but too specific
    - depguard # Go linter that checks if package imports are in a list of acceptable packages
    - gomodguard # Allow/block list for direct Go module dependencies

    # Too opinionated / doesn't solve problems we have
    - funcorder # Checks that exported functions are declared before unexported functions
    - funlen # Tool for detection of long functions
    - godox # Tool for detection of FIXME, TODO and other comment keywords || There is absolutely nothing wrong having in-code FIXMEs and TODOs
    - nakedret # Finds naked returns in functions greater than a specified function length
    - nlreturn # checks for a new line before return and branch statements to increase code clarity
    - noinlineerr # Disallows inline error handling (`if err := ...; err != nil {`)
    - nonamedreturns # Prevent named return || We use this in defers. Also useful when returning multiple params
    - varnamelen # Find var names that are too short
    - wsl # Forces you to use empty lines
    - wsl_v5 # Forces you to use empty lines

    # Cool on paper, but hard to use productively
    - cyclop # checks function and package cyclomatic complexity
    - dupl # Tool for code clone detection
    - gochecknoglobals # check that no global variables exist
    - gocognit # Computes and checks the cognitive complexity of functions
    - goconst # Finds repeated strings that could be replaced by a constant
    - gocyclo # Computes and checks the cyclomatic complexity of functions
    - lll # Reports long lines
    - mnd # An analyzer to detect magic numbers
    - nestif # Reports deeply nested if statements
    - testpackage # linter that makes you use a separate _test package
    - wrapcheck # Checks that errors returned from external packages are wrapped

    # to try
    - godot # Check if comments end in a period
    - paralleltest # Detects missing usage of t.Parallel() method in your Go test
    - thelper # detects golang test helpers without t.Helper() call and checks the consistency of test helpers

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/labstack/echo
              desc: replace with github.com/labstack/echo/v4
    exhaustruct:
      exclude:
        - database/sql\.NullString$
        - database/sql\.TxOptions$
        - net/http\.Response$
        - net/http\.Client$
        - net/http\.Cookie$
        - github.com/google/uuid\.NullUUID$
        - github.com/golang-migrate/migrate/v4/database/postgres\.Config$
        - github.com/sethvargo/go-envconfig\.Config$
        - github.com/ashwanthkumar/slack-go-webhook\.Payload$
        - github.com/spf13/cobra\.Command$
        - github.com/Nivl/config/internal/brew\.CaskOutcome$
        - github.com/Nivl/config/internal/brew/brewtest\.FakeRunner$
        - github.com/Nivl/config/internal/packages\.Summary$
        - github.com/Nivl/config/internal/packages\.FailedCask$
        - github.com/Nivl/config/internal/packages\.Opts$
        - github.com/Nivl/config/internal/claude/sync/state\.Paths$
        - github.com/Nivl/config/internal/claude/sync/state\.Decisions$
        - github.com/Nivl/config/internal/claude/sync/state/statetest\.FakeGit$
        - github.com/Nivl/config/internal/claude/sync/prompt\.Request$
        - github.com/Nivl/config/internal/claude/sync/prompt/prompttest\.FakePrompter$
        - github.com/Nivl/config/internal/claude/sync/prompt\.stubRenderer$
        - github.com/Nivl/config/internal/claude/sync/prompt\.fakeReporter$
        - github.com/Nivl/config/internal/claude/sync/prompt\.fakeFileChange$
        - github.com/Nivl/config/internal/claude/sync/settings\.Decision$
        - github.com/Nivl/config/internal/claude/sync/settings\.presence$
        - github.com/Nivl/config/internal/claude/sync/settings\.Result$
        - github.com/Nivl/config/internal/claude/sync/settings\.Options$
        - github.com/Nivl/config/internal/claude/sync/settings\.conflictRenderer$
        - github.com/Nivl/config/internal/claude/sync/settings\.fakeReporter$
        - github.com/Nivl/config/internal/claude/sync/settings\.fakeFileChange$
        - github.com/Nivl/config/internal/claude/sync/files\.Decision$
        - github.com/Nivl/config/internal/claude/sync/files\.Presence$
        - github.com/Nivl/config/internal/claude/sync/files\.Equality$
        - github.com/Nivl/config/internal/claude/sync/files\.FileResult$
        - github.com/Nivl/config/internal/claude/sync/files\.fileConflictRenderer$
        - github.com/Nivl/config/internal/claude/sync/files\.DirResult$
        - github.com/Nivl/config/internal/claude/sync/files\.Options$
        - github.com/Nivl/config/internal/claude/sync/files\.fakeReporter$
        - github.com/Nivl/config/internal/claude/sync/files\.fakeFileChange$
        - github.com/Nivl/config/internal/claude/sync\.Summary$
        - github.com/Nivl/config/internal/claude/sync\.Options$
        - github.com/Nivl/config/internal/claude/sync\.fakeReporter$
        - github.com/Nivl/config/internal/claude/sync\.fakeFileChange$
        - github.com/Nivl/config/internal/claude/sync\.fakeSymlink$
        - github.com/Nivl/config/internal/configgen\.ZshrcOpts$
        - github.com/Nivl/config/internal/configgen/configgentest\.FakeCmdRunner$
        - github.com/Nivl/config/internal/appsetup/appsetuptest\.FakeCmdRunner$
        - github.com/Nivl/config/internal/appsetup/appsetuptest\.FakeYesNoPrompter$
        - github.com/Nivl/config/internal/cmd\.appConfig$
        - github.com/Nivl/config/internal/cmd\.claudeSyncParams$
        - github.com/Nivl/config/internal/cmd\.setupParams$
        - github.com/Nivl/config/internal/iox\.Streams$
        - github.com/Nivl/config/internal/dryrun\.realReporter$
        - github.com/Nivl/config/internal/claude/perms\.Diff$
        - github.com/Nivl/config/internal/cmd\.permsFlags$
        - github.com/Nivl/config/internal/cmd\.addAction$
        - github.com/Nivl/config/internal/cmd\.readerHook$
        - github.com/Nivl/config/internal/cmd\.bootstrapCall$
        - github.com/Nivl/config/internal/cmd\.recordingSetupReporter$
        - github.com/Nivl/config/internal/managedblock\.UpsertOpts$
        - github.com/Nivl/config/internal/managedblock\.fakeReporter$
        - github.com/Nivl/config/internal/symlinkfs\.InstallOpts$
        - github.com/Nivl/config/internal/symlinkfs\.fakeReporter$
        - github.com/Nivl/config/internal/brew\.fakeRunner$
        - github.com/Nivl/config/internal/brew\.fakeReporter$
        - github.com/Nivl/config/internal/brew\.fakeShellout$
        - github.com/Nivl/config/internal/appsetup\.fakeReporter$
        - github.com/Nivl/config/internal/appsetup\.fakeShellout$
    gocritic:
      disabled-checks:
        - sloppyReassign
        - hugeParam
        - singleCaseSwitch
      enabled-tags:
        - performance
        - diagnostic
        - style
        - experimental
        - opinionated
    gosec:
      excludes:
        - G104 # Error checking - there's another linter for that
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    tagalign:
      order:
        - db
        - json
        - exhaustruct

  exclusions:
    generated: lax
    rules:
      - linters:
          - govet
        text: 'shadow: declaration of "err"' # there's another linter for that

      - linters:
          - err113
        text: do not define dynamic errors # Not all errors need to be compared

      - linters:
          - recvcheck # don't mix receiver types
        path: secret/secret\.go #we have this one in almost all our projects

      - linters:
          - gofumpt # gofumpt conflicts with goimports local-prefixes grouping; golangci-lint v2 fmt/run are inconsistent
        path: (internal/(brew|claude/sync|errutil|packages|secret)|cmd/melvin-config)/

      - linters:
          - err113
          - errcheck
          - forcetypeassert
          - gosec
          - maintidx
        path: _test\.go

      - linters:
          - err113
          - errcheck
          - forcetypeassert
          - gosec
          - maintidx
        path: testutil/

      - linters:
          - errcheck # fmt.Fprint* to io.Writer — write errors are intentionally ignored (progress output)
        path: internal/packages/
        text: "fmt\\.F(print|printf|println)"

      - linters:
          - errcheck # fmt.Fprint* to io.Writer — write errors are intentionally ignored (progress output)
        path: internal/claude/sync/prompt/
        text: "fmt\\.F(print|printf|println)"

      - linters:
          - errcheck # fmt.Fprint* to io.Writer — write errors are intentionally ignored (progress output)
        path: internal/userinput/existingfile\.go
        text: "fmt\\.F(print|printf|println)"

      - linters:
          - errcheck # fmt.Fprint* to io.Writer — write errors are intentionally ignored (progress output)
        path: internal/claude/sync/settings/
        text: "fmt\\.F(print|printf|println)"

      - linters:
          - errcheck # fmt.Fprint* to io.Writer — write errors are intentionally ignored (progress output)
        path: internal/claude/sync/files/
        text: "fmt\\.F(print|printf|println)"

      - linters:
          - gosec # G204: /usr/bin/diff subprocess call is intentional for diff rendering
        path: internal/claude/sync/files/

      - linters:
          - gosec # G204: subprocess calls are intentional; brew is the only shell-out package
        path: internal/brew/

      - linters:
          - forcetypeassert # FakeRunner delegates to mock.Arguments; panics are intentional test failures
        path: internal/brew/runner_fake\.go

      - linters:
          - forcetypeassert # FakePrompter delegates to mock.Arguments; panics are intentional test failures
        path: internal/claude/sync/prompt/prompt_fake\.go

      - path: _test\.go
        text: "fieldalignment: struct"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Nivl/config
  exclusions:
    generated: lax
